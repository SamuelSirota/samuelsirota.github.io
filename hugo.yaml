baseURL: https://samuelsirota.github.io
languageCode: en-us
title: Samuel Sirota
theme: ["PaperMod"]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod","prispevky"]

minify:
  disableXML: true
  # minifyOutput: true

languages:
  en:
    languageName: "🇬🇧"
    weight: 1
    taxonomies:
      tag: tags
    menu:
      main:
        - name: Posts
          url: posts/
          weight: 4
        - name: About me
          url: about-me/
          weight: 5
        - name: Search
          url: search/
          weight: 9
        - name: Archive
          url: archives/
          weight: 10
        - name: Tags
          url: tags/
          weight: 10
    
    params:
      profileMode:
        enabled: true
        title: Samuel Sirota
        imageUrl: "https://raw.githubusercontent.com/googlefonts/noto-emoji/master/svg/emoji_u1f9d1_1f3fb_200d_1f4bb.svg"
        imageTitle: image
        # imageWidth: 120
        # imageHeight: 120
        subtitle: "☄️ Fast | ☁️ Fluent | 🌙 Smooth | 📱 Responsive"
        buttons:
          - name: Blog
            url: posts/
          - name: About me
            url: about-me/

  sk:
    languageName: "🇸🇰"
    weight: 2
    title: Samuel Sirota
    taxonomies:
      tag: tags
    menu:
      main:
        - name: Príspevky
          url: sk/posts/
          weight: 4
        - name: O mne
          url: o-mne/
          weight: 5
        - name: Hľadať
          url: hladat/
          weight: 9
        - name: Archív
          url: archiv/
          weight: 10
        - name: Tagy
          url: tags/
          weight: 10
        

    # custom params for each language should be under [langcode].parms - hugo v0.120.0
    params:
      profileMode:
        enabled: true
        title: Samuel Sirota
        imageUrl: "https://raw.githubusercontent.com/googlefonts/noto-emoji/master/svg/emoji_u1f9d1_1f3fb_200d_1f4bb.svg"
        imageTitle: obrazok
        # imageWidth: 120
        # imageHeight: 120
        subtitle: "☄️ Rychly | ☁️ Plynuly | 🌙 Hladky | 📱 Responzivny"
        buttons:
          - name: Blog
            url: posts/
          - name: O mne
            url: o-mne/

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Samuel Sirota personal website"
  author: Samuel Sirota
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "PaperMod's Demo"
    Content: >
      👋 Welcome to demo page of Hugo's theme PaperMod!

      - **PaperMod**  is designed to be clean and simple but fast and responsive theme with useful feature-set that enhances UX.

      - Feel free to show your support by giving us a star 🌟 on GitHub and sharing with your friends and social media .

      - PaperMod is based on theme [Paper](https://github.com/nanxiaobei/hugo-paper/tree/4330c8b12aa48bfdecbcad6ad66145f679a430b3).

  socialIcons:
    - name: github
      url: "https://github.com/SamuelSirota"
    - name: X
      url: "https://x.com/SamkoPengu"
    - name: linkedin
      url: "https://www.linkedin.com/in/samuelsirota/"

  editPost:
    URL: "https://github.com/adityatelange/hugo-PaperMod/tree/exampleSite/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # label:
  # iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" height="25" viewBox="0 -960 960 960" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>'
  # text: "Home"
  # icon: icon.png
  # iconHeight: 35

  # analytics:
  #     google:
  #         SiteVerificationTag: "XYZabc"

  assets:
    disableHLJS: true
  #     favicon: "<link / abs url>"
  #     favicon16x16: "<link / abs url>"
  #     favicon32x32: "<link / abs url>"
  #     apple_touch_icon: "<link / abs url>"
  #     safari_pinned_tab: "<link / abs url>"

  # cover:
  #     hidden: true # hide everywhere but not in structured data
  #     hiddenInList: true # hide on list pages and home
  #     hiddenInSingle: true # hide on single page

  # fuseOpts:
  #     isCaseSensitive: false
